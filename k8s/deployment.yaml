apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenger
  namespace: techchallenger-ns
  labels:
    app: techchallenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techchallenger
  template:
    metadata:
      labels:
        app: techchallenger
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "techchallenger-api"
        tags.datadoghq.com/version: "${DD_VERSION}"
      annotations:
        ad.datadoghq.com/techchallenger.logs: '[{"source":"csharp","service":"techchallenger-api"}]'
    spec:
      containers:
        - name: techchallenger
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: techchallenger-config
            - secretRef:
                name: techchallenger-secrets
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: Datadog__AgentHost
              value: "$(DD_AGENT_HOST)"
            - name: DD_VERSION
              value: "${DD_VERSION}"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
