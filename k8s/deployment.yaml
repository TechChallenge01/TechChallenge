apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenger
  namespace: techchallenger-ns
  labels:
    app: techchallenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techchallenger
  template:
    metadata:
      labels:
        app: techchallenger
    spec:
      containers:
        - name: techchallenger
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: techchallenger-config
            - secretRef:
                name: techchallenger-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
